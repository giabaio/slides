title: ucl
description: UCL 2026 template
author: Gianluca Baio
version: 1.0.0
contributes:
  formats:
    revealjs:
      css:
          - ./css/fonts.css
          - ./css/common.css
      template-partials:
          - title-slide.html
      include-in-header:
          - ./assets/latex_macros.html
          # This allows to print-to-pdf usign `decktape`, which must be
          # installed separately
          - ./assets/decktape_tag.html
      transition: none
      slide-number: true
      chalkboard:
         buttons: false
      preview-links: auto
      theme: ucl-new.scss
      width: 1500
      height: 900
      title-slide-attributes:
      data-background-size: stretch
      data-background-opacity: "0.08"
      data-slide-number: "false"
      footer: "{{< meta footer >}}"

    beamer:
      fig-format: png
      fig-dpi: 300
      aspectratio: 1610
      pdf-engine: lualatex
      keep-tex: false
      slide-level: 2
      # Defines the basic font-size. Can be increased if necessary and all fonts will increase proportionally
      fontsize: 10pt
      section-titles: false      # we draw our own via \AtBeginSection
      # tex template
      include-in-header:
          - ./beamer/ucl-beamer.tex
      # lua filters to create the various components, including the footer
      filters:
          - ./beamer/beamer-meta.lua
          - ./beamer/colour-spans.lua
          - ./beamer/beamer-fragments.lua
      # Sensible defaults; users can override in their own YAML
      colorlinks: true
      linkcolor: uclgold
      urlcolor: uclgold
      citecolor: uclgold
